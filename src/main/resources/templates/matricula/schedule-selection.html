<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selección de Horario - USIL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/"><i class="bi bi-book-half"></i> USIL Matrícula</a>
    </div>
</nav>

<div class="container container-main">
    
    <div class="step-indicator">
        <div class="step">1. Curso</div>
        <div class="step">2. Docente</div>
        <div class="step active">3. Horario</div>
    </div>

    <div class="mb-4 d-flex justify-content-between align-items-center">
        <div>
            <h2 class="fw-bold">Selecciona tu Horario</h2>
            <p class="text-muted">
                Curso: <span class="fw-semibold text-dark" th:text="${curso.nombre}"></span> | 
                Docente: <span class="fw-semibold text-dark" th:text="${docente.nombre}"></span>
            </p>
        </div>
        <a th:href="@{/matricula/docentes(cursoId=${curso.id})}" class="btn btn-outline-secondary rounded-pill">Atrás</a>
    </div>

    <div class="row g-4">
        <div class="col-md-6" th:each="seccion : ${secciones}">
            <div class="glass-card p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold mb-0 text-primary"><i class="bi bi-clock"></i> <span th:text="${seccion.diaSemana}"></span></h5>
                    <span class="badge" 
                          th:classappend="${seccion.isLleno()} ? 'bg-danger' : 'bg-success'"
                          th:text="${seccion.inscritos + ' / ' + seccion.capacidad + ' inscritos'}">
                    </span>
                </div>
                
                <div class="mb-4 fs-5">
                    <i class="bi bi-stopwatch text-muted"></i> 
                    <span th:text="${seccion.horaInicio}"></span> - <span th:text="${seccion.horaFin}"></span>
                    <br>
                    <small class="text-muted fs-6"><i class="bi bi-hash"></i> Bloque: <span th:text="${seccion.codigoBloque}"></span></small>
                </div>
                
                <form th:action="@{/matricula/agregar}" method="post">
                    <input type="hidden" name="seccionId" th:value="${seccion.id}">
                    <button type="submit" class="btn btn-primary-custom w-100" th:disabled="${seccion.isLleno()}">
                        <i class="bi bi-plus-circle"></i> Agregar a Horario
                    </button>
                </form>
            </div>
        </div>
        
        <div th:if="${secciones.empty}" class="col-12">
            <div class="alert alert-warning">
                No hay horarios disponibles para este curso con este docente.
            </div>
        </div>
    </div>

</div>

</body>
</html>
