<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Administrador</title>

    <link rel="stylesheet" th:href="@{/style/style.css}">
</head>
<body>

<header>
    <h1>Panel de Administración</h1>
</header>

<div class="container">

    <div class="card">

        <h2>Crear Nuevo Curso</h2>

        <div th:if="${error}" class="error-box">
            <p th:text="${error}"></p>
        </div>

        <form th:action="@{/admin/guardar}" method="post">

            <label>Código</label>
            <input type="text"
                   name="codigo"
                   required>

            <label>Nombre</label>
            <input type="text"
                   name="nombre"
                   minlength="3"
                   required>

            <label>Créditos</label>
            <input type="number"
                   name="creditos"
                   min="1"
                   max="6"
                   required>

            <button type="submit">
                Crear Curso
            </button>

        </form>

    </div>

    <div class="card">

        <h2>Cursos Registrados</h2>

        <table>

            <thead>
            <tr>
                <th>Código</th>
                <th>Nombre</th>
                <th>Créditos</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="curso : ${cursos}">
                <td th:text="${curso.codigo}"></td>
                <td th:text="${curso.nombre}"></td>
                <td th:text="${curso.creditos}"></td>
            </tr>
            </tbody>

        </table>

    </div>

</div>

</body>
</html>
