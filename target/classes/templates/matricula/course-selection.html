<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selección de Curso - USIL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/"><i class="bi bi-book-half"></i> USIL Matrícula</a>
        <div class="d-flex text-white align-items-center">
            <span class="me-3"><i class="bi bi-person-circle"></i> <span th:text="${estudiante.nombre}"></span></span>
        </div>
    </div>
</nav>

<div class="container container-main">
    
    <div class="step-indicator">
        <div class="step active">1. Curso</div>
        <div class="step">2. Docente</div>
        <div class="step">3. Horario</div>
    </div>

    <div class="mb-4 d-flex justify-content-between align-items-center">
        <h2 class="fw-bold">Selecciona un Curso</h2>
        <a href="/matricula/dashboard" class="btn btn-outline-secondary rounded-pill">Volver</a>
    </div>

    <div class="row g-4">
        <div class="col-md-4" th:each="curso : ${cursosDisponibles}">
            <div class="glass-card h-100 p-4 d-flex flex-column">
                <div class="d-flex justify-content-between align-items-start mb-3">
                    <span class="badge bg-secondary badge-custom" th:text="${curso.codigo}"></span>
                    <span class="badge bg-info text-dark badge-custom"><span th:text="${curso.creditos}"></span> Créditos</span>
                </div>
                <h4 class="fw-bold mb-3" th:text="${curso.nombre}"></h4>
                <div class="mt-auto pt-3 border-top text-end">
                    <a th:href="@{/matricula/docentes(cursoId=${curso.id})}" class="btn btn-primary-custom w-100">
                        Elegir Docente <i class="bi bi-arrow-right"></i>
                    </a>
                </div>
            </div>
        </div>
        
        <div th:if="${cursosDisponibles.empty}" class="col-12">
            <div class="alert alert-warning">
                No hay cursos disponibles para matrícula que cumplan con los prerrequisitos o ya estás matriculado en todos los disponibles.
            </div>
        </div>
    </div>

</div>

</body>
</html>
